<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; color: #333; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e8ed; }
        h2 { margin-top: 0; color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #219150; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ecf0f1; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f2f4f4; color: #2c3e50; }
        tr:nth-child(even) { background-color: #fafafa; }
    </style>
</head>
<body>

    <h1>Student & Study Log Management</h1>

    <div class="grid">
        <!-- Student Service Section -->
        <div class="card">
            <h2>Student Management</h2>
            <form id="studentForm">
                <input type="text" id="studentName" placeholder="Full Name" required />
                <input type="email" id="studentEmail" placeholder="Email Address" required />
                <button type="submit">Add Student</button>
            </form>

            <h3>Registered Students</h3>
            <table id="studentTable">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Study Log Service Section -->
        <div class="card">
            <h2>Study Logs</h2>
            <form id="logForm">
                <input type="number" id="logStudentId" placeholder="Student ID" required />
                <input type="text" id="subject" placeholder="Subject / Topic" required />
                <input type="number" id="duration" placeholder="Duration (Minutes)" required />
                <button type="submit">Log Session</button>
            </form>

            <h3>Recorded Sessions</h3>
            <table id="logTable">
                <thead>
                    <tr><th>Log ID</th><th>Student ID</th><th>Subject</th><th>Minutes</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchStudents() {
            try {
                const res = await fetch('/api/students');
                if (res.ok) {
                    const students = await res.json();
                    const tbody = document.querySelector('#studentTable tbody');
                    tbody.innerHTML = students.map(s => 
                        `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.email}</td></tr>`
                    ).join('');
                }
            } catch (err) { console.error('Error fetching students:', err); }
        }

        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                if (res.ok) {
                    const logs = await res.json();
                    const tbody = document.querySelector('#logTable tbody');
                    tbody.innerHTML = logs.map(l => 
                        `<tr><td>${l.id}</td><td>${l.studentId}</td><td>${l.subject}</td><td>${l.durationMinutes}</td></tr>`
                    ).join('');
                }
            } catch (err) { console.error('Error fetching logs:', err); }
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('studentName').value;
            const email = document.getElementById('studentEmail').value;

            const res = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });

            if (res.ok) {
                document.getElementById('studentForm').reset();
                fetchStudents();
            }
        });

        document.getElementById('logForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentId = document.getElementById('logStudentId').value;
            const subject = document.getElementById('subject').value;
            const durationMinutes = document.getElementById('duration').value;

            const res = await fetch('/api/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ studentId, subject, durationMinutes })
            });

            if (res.ok) {
                document.getElementById('logForm').reset();
                fetchLogs();
            }
        });

        // Initial Data Load
        fetchStudents();
        fetchLogs();
    </script>
</body>
</html>
