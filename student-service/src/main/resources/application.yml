server:
  port: 8081

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-service.default.svc.cluster.local}:${DB_PORT:5432}/student_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
